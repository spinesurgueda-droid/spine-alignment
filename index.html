<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131a20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spine Align">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>脊椎アライメント計測</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen viewer. Header (slots) / X-ray stage / bottom sheet of parameters, like a PACS reading station shrunk to a phone. */
:root{
  --bg:#0c1014; --stage:#05070a; --panel:#131a20; --panel2:#1a232b; --line:#26323c;
  --fg:#e4eaef; --mut:#8a98a5; --acc:#5cc8f5; --anno:#f1d264;
  --ok:#4fc28c; --warn:#f0a43c; --bad:#ff6f6f;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100%}
[hidden]{display:none!important}

/* header */
#top{background:var(--panel);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.r1,.r2{display:flex;align-items:center;gap:8px;min-width:0}
.ctx{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;gap:9px;padding:0 10px;text-align:left}
.ctx .tx{min-width:0;display:flex;flex-direction:column;line-height:1.2;flex:1}
.ctx b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx small{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx svg{width:14px;height:14px;stroke:var(--mut);fill:none;stroke-width:2;flex:none}
.mark{width:10px;height:18px;border-radius:2px;align-self:center;background:linear-gradient(var(--anno) 0 22%,transparent 22% 39%,var(--anno) 39% 61%,transparent 61% 78%,var(--anno) 78%)}
.ib{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;padding:0;flex:none}
.ib svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.btn.pri{background:var(--acc);color:#04202d;border-color:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;flex:none}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 10px;font-size:13px;color:var(--mut);position:relative;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.seg button i{position:absolute;top:4px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--anno)}
.chip{height:30px;border-radius:15px;border:1px solid var(--line);background:transparent;padding:0 10px;font-size:12px;color:var(--mut);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.r2{overflow-x:auto;scrollbar-width:none}
.r2::-webkit-scrollbar{display:none}

/* stage */
#stage{position:relative;overflow:hidden;background:var(--stage);touch-action:none;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#loupe{position:absolute;width:132px;height:132px;border-radius:50%;border:2px solid var(--acc);box-shadow:0 6px 24px #000a;pointer-events:none;top:64px}
#prompt{position:absolute;left:10px;right:10px;top:10px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:9px 10px 9px 12px;display:flex;flex-direction:column;gap:6px}
#prompt .pm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#prompt .stp{font-family:var(--f-num);font-size:11.5px;color:var(--acc)}
#prompt b{font-size:15px;font-weight:600}
#prompt .sub{color:var(--anno);font-weight:600}
#prompt .hint{font-size:12px;color:var(--mut);line-height:1.45}
#prompt .pa{display:flex;gap:6px;flex-wrap:wrap}
#prompt .pr{display:flex;gap:10px;align-items:flex-start}
#prompt .pmn{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.gthumb{width:88px;height:88px;flex:none;border-radius:10px;border:1px solid var(--line);background:#0a0d10;padding:0;overflow:hidden;position:relative}
.gthumb svg{width:100%;height:100%;display:block}
.gthumb span{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;background:#000a;color:var(--fg);padding:2px 0;text-align:center;letter-spacing:.04em}
.gfig{flex:none;border:1px solid var(--line);border-radius:12px;background:#0a0d10;overflow:hidden}
.gfig svg{width:100%;height:auto;display:block}
.gfig .cap{font-size:11.5px;color:var(--mut);padding:6px 10px;border-top:1px solid var(--line)}
.glist{display:flex;flex-direction:column;gap:10px}
.glist div{border-left:3px solid var(--line);padding:2px 0 2px 10px}
.glist div.on{border-left-color:var(--acc)}
.glist b{font-size:13.5px;font-weight:600}
.glist p{margin:3px 0 0;font-size:12.5px;line-height:1.65;color:var(--mut)}
.lrn{display:flex;flex-direction:column;gap:8px}
.lrn .mean{color:var(--fg);font-size:13px;line-height:1.7}
.lrn h4{margin:4px 0 0;font-size:11.5px;font-weight:600;color:var(--acc);letter-spacing:.06em}
.lfig svg{max-height:320px}
.lrn ol{margin:0;padding-left:1.4em;font-size:12.5px;line-height:1.7;color:var(--mut)}
.lrn ol b{color:var(--fg);font-weight:500}
.lrn details summary{cursor:pointer;font-size:12.5px;color:var(--acc)}
#empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
#empty .card{max-width:340px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--mut);line-height:1.6}
#empty .card strong{color:var(--fg);font-size:16px;font-weight:600}
.zoomtag{position:absolute;right:10px;bottom:8px;font-family:var(--f-num);font-size:11px;color:var(--mut);pointer-events:none;background:#0008;padding:2px 6px;border-radius:6px}

/* sheet */
#sheet{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;max-height:46vh;max-height:46dvh;min-height:0;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.max{max-height:80vh;max-height:80dvh}
#grip{border:0;background:transparent;height:20px;display:grid;place-items:center;flex:none;padding:0}
#grip span{width:40px;height:4px;border-radius:2px;background:var(--line)}
#regions{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px;flex:none;scrollbar-width:none}
#regions::-webkit-scrollbar{display:none}
#regions button,.chips button{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:16px;height:32px;padding:0 12px;font-size:13px;color:var(--mut);display:inline-flex;align-items:center;gap:6px}
#regions button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#regions button small,.chips button small{font-family:var(--f-num);font-size:10.5px;opacity:.75}
#sbody{overflow-y:auto;min-height:0;padding:0 12px 12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
#sbody>*{flex-shrink:0}
#sheet.min #sbody{display:none}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:12px}
.det{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.det .dt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.det h3{margin:0;font-size:15px;font-weight:600;text-wrap:balance}
.det .en{font-size:11.5px;color:var(--mut);letter-spacing:.02em}
.det .big{font-family:var(--f-num);font-size:26px;font-variant-numeric:tabular-nums;white-space:nowrap}
.det .big small{font-size:14px;color:var(--mut);margin-left:2px}
.det p{margin:0;font-size:12.5px;line-height:1.6;color:var(--mut)}
.det .note{color:var(--fg);font-size:13px}
.det .acts{display:flex;gap:6px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:9px 12px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%;position:relative}
.row:first-child{border-top:0}
.row[aria-current="true"]{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.row[aria-current="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.row .nm{font-size:13.5px;min-width:0}
.row .nm small{display:block;color:var(--mut);font-size:11px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px;text-align:right;white-space:nowrap;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.row .val small{color:var(--mut);font-size:11.5px}
.row .todo{font-family:var(--f-body);font-size:12px;color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mut)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap;font-family:var(--f-body)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.na{color:var(--mut)}
.dyn{display:grid;grid-template-columns:1fr repeat(3,auto);gap:0 12px;align-items:center;font-variant-numeric:tabular-nums}
.dyn div{padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.dyn .h{color:var(--mut);font-size:11px;border-top:0;padding-top:0}
.dyn .n{font-family:var(--f-num);text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;padding:10px 12px}

#regions button.tr{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.prow:first-child{border-top:0}
.prow.on{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.prow b{font-weight:600;font-size:14px}
.prow small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .rt{font-size:11.5px;color:var(--mut);text-align:right;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11.5px;color:var(--mut)}
.fld input,.fld select,.fld textarea{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 10px;width:100%;min-width:0}
.fld textarea{height:60px;min-height:0;padding:8px 10px;font-family:var(--f-body);font-size:13px;line-height:1.5}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.srow:first-child{border-top:0}
.srow.on{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.srow input{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 8px;min-width:0;width:100%}
.srow .meta{font-size:12px;color:var(--mut)}
.srow .sa{display:flex;gap:6px;justify-content:flex-end}
.trtbl{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px;min-width:100%}
.trtbl th,.trtbl td{padding:7px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.trtbl th:first-child,.trtbl td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);max-width:150px;overflow:hidden;text-overflow:ellipsis}
.trtbl thead th{border-top:0;color:var(--mut);font-weight:500;font-size:11px;vertical-align:bottom;line-height:1.35}
.trtbl tbody tr{cursor:pointer}
.trtbl tr.on td{background:color-mix(in srgb,var(--acc) 12%,var(--panel))}
.trtbl td.n{font-family:var(--f-num)}
.trtbl .ok{color:var(--ok)}.trtbl .warn{color:var(--warn)}.trtbl .bad{color:var(--bad)}
.tblwrap.flush{padding:0}
.chart{border:1px solid var(--line);border-radius:12px;padding:10px 8px 4px}
.chart svg{width:100%;height:auto;display:block}
.chart .ct{font-size:12.5px;padding:0 6px 4px;display:flex;justify-content:space-between;gap:8px}
.chart .ct span{color:var(--mut)}
/* modal */
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20}
#modal .mc{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
#modal .mc>*{flex-shrink:0}
@media (min-width:700px){#modal{align-items:center}#modal .mc{border-radius:16px}}
.mh{display:flex;justify-content:space-between;align-items:center}
.mh h2{margin:0;font-size:16px;font-weight:600}
.fs{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.fs > label,.fs .lab{font-size:12px;color:var(--mut);letter-spacing:.04em}
.fl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fl input[type=number],.fl input[type=text]{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 10px;width:120px;font-family:var(--f-num)}
.fl input[type=range]{flex:1;min-width:140px;accent-color:var(--acc)}
.fl .v{font-family:var(--f-num);font-size:12px;color:var(--mut);min-width:44px;text-align:right}
.small{font-size:12px;color:var(--mut);line-height:1.6;margin:0}
textarea{width:100%;min-height:220px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--f-num);font-size:12px;line-height:1.55;resize:vertical}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){#toast{animation:tin .18s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}}}
</style>
</head>
<body>


<div id="app">
  <header id="top">
    <div class="r1">
      <button class="ctx" id="bCtx" aria-label="患者・測定日を選ぶ"><span class="mark" aria-hidden="true"></span><span class="tx"><b id="ctxP">Spine Align</b><small id="ctxS">脊椎アライメント計測</small></span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <label class="btn pri" for="file"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>画像</label>
      <input id="file" class="vh" type="file" accept="image/*,.dcm,application/dicom">
      <button id="bRep" class="ib" aria-label="レポート" title="レポート"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg></button>
      <button id="bSet" class="ib" aria-label="設定" title="設定"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
    <div class="r2">
      <div id="slots" class="seg" role="group" aria-label="画像スロット"></div>
      <button id="bUndo" class="ib" style="width:32px;height:32px" aria-label="元に戻す" title="元に戻す"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button id="bFace" class="chip"></button>
      <button id="bCal" class="chip"></button>
      <button id="bFit" class="chip">全体表示</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <canvas id="loupe" hidden></canvas>
    <div id="empty" hidden><div class="card"><strong>このスロットに画像がありません</strong><span>X線画像（JPEG / PNG / 非圧縮DICOM）を読み込みます。スマホで撮影したフィルムやモニターの写真も使えます。画像は端末内だけで処理され、外部には送信されません。</span><label class="btn pri" for="file">画像を読み込む</label></div></div>
    <div id="prompt" hidden>
      <div class="pr"><div class="pmn"><div class="pm"><span class="stp" id="pStep"></span><b id="pName"></b><span class="sub" id="pSub"></span></div>
      <div class="hint" id="pHint"></div></div><button class="gthumb" id="pGuide" aria-label="この点の位置を図で確認"></button></div>
      <div class="pa"><button class="btn sm" id="pBack">1つ戻す</button><button class="btn sm" id="pSkip">スキップ</button><button class="btn sm ghost" id="pStop">終了</button></div>
    </div>
    <div class="zoomtag" id="ztag"></div>
  </main>
  <section id="sheet" class="mid">
    <button id="grip" aria-label="パネルの大きさを切り替え"><span></span></button>
    <nav id="regions" aria-label="部位"></nav>
    <div id="sbody"></div>
  </section>
</div>
<div id="modal" hidden><div class="mc" id="mc"></div></div>
<div id="toast" hidden></div>

<script>
'use strict';
/* ================= geometry ================= */
const R2D=180/Math.PI,D2R=Math.PI/180;
const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y}),add=(a,b)=>({x:a.x+b.x,y:a.y+b.y}),mul=(a,k)=>({x:a.x*k,y:a.y*k});
const dot=(a,b)=>a.x*b.x+a.y*b.y,crs=(a,b)=>a.x*b.y-a.y*b.x,len=a=>Math.hypot(a.x,a.y);
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2}),dist=(a,b)=>len(sub(a,b)),unit=a=>{const l=len(a)||1;return{x:a.x/l,y:a.y/l}};
const ang=v=>Math.atan2(v.y,v.x)*R2D;            // vs horizontal
const tilt=v=>Math.atan2(v.x,v.y)*R2D;           // vs vertical-up, + = anterior (sag) / patient right (cor)
const nd=a=>{a%=360;if(a>180)a-=360;if(a<-180)a+=360;return a};
const btw=(u,v)=>Math.acos(Math.max(-1,Math.min(1,dot(u,v)/((len(u)*len(v))||1))))*R2D;

function complete(k,a){const n=LM[k]?LM[k].subs.length:1;if(!a)return false;for(let i=0;i<n;i++)if(!a[i])return false;return true}
function getPts(sl,k){const r=sl.pts[k];if(r&&complete(k,r))return r;const d=DER[k];if(!d)return null;
  const a=sl.pts[d[0]];if(!complete(d[0],a))return null;if(d[1]===1)return[a[1]];if(d[1]==='m')return[mid(a[0],a[1])];
  const b=sl.pts[d[1]];if(!complete(d[1],b))return null;return[{x:(a[0].x+a[1].x+b[0].x+b[1].x)/4,y:(a[0].y+a[1].y+b[0].y+b[1].y)/4}]}
function facing(sl){if(sl.facing==='R')return 1;if(sl.facing==='L')return -1;let v=0;
  for(const [a,b] of ANTPOST){const A=getPts(sl,a),B=getPts(sl,b);if(A&&B)v+=2*Math.sign(A[0].x-B[0].x)}
  for(const k in sl.pts){const d=LM[k];if(!d||d.type!=='ln'||/^(AP_|FR_|_)/.test(k))continue;const a=sl.pts[k];if(complete(k,a))v+=Math.sign(a[0].x-a[1].x)}
  return v<0?-1:1}
function makeG(sl,view){
  const ap=sl.apStd!=null?sl.apStd:st.apStd,fx=view==='s'?facing(sl):view==='c'?(ap?-1:1):1;
  const F=p=>({x:p.x*fx,y:-p.y});
  return{mmpp:sl.mmpp,age:sl.age!==undefined?sl.age:ageFor(st.sid),has:k=>!!getPts(sl,k),
    p:k=>{const a=getPts(sl,k);return a.length>1?F(mid(a[0],a[1])):F(a[0])},
    l:k=>{const a=getPts(sl,k);let A=F(a[0]),B=F(a[1]);if(view!=='f'&&A.x<B.x){const t=A;A=B;B=t}return{A,P:B}}};
}
function regView(rid){return REG.find(r=>r.id===rid).v}
function compute(p,sl){if(!sl||!(sl.base||sl.has))return null;for(const k of p.lm)if(!getPts(sl,k))return null;
  const rv=regView(p.r),view=rv==='f'?'f':rv==='c'?'c':'s';
  try{const r=p.f(makeG(sl,view));if(r&&typeof r.v==='number'&&!isFinite(r.v))return null;return r}catch(e){console.warn(p.id,e);return null}}
function missing(p,sl){let n=0;for(const k of p.lm)if(!getPts(sl,k)){const r=sl.pts[k]||[];LM[k].subs.forEach((_,i)=>{if(!r[i])n++})}return n}
function fmtV(r){if(typeof r.v==='string')return r.v;const d=r.u===''?2:(r.u==='点'?0:1);return(Math.round(r.v*10**d)/10**d).toFixed(d)}
function unitTxt(r){return r.u==='px'?'px':r.u}

function resize(){const r=stage.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,3);CW=r.width;CH=r.height;
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);lp.width=132*DPR;lp.height=132*DPR;
  const sl=cur();if(sl.base&&!sl.vw)fit(sl);render()}
new ResizeObserver(resize).observe(stage);
function fit(sl,box){if(!sl.base||!CW)return;let x0=0,y0=0,w=sl.base.width,h=sl.base.height;
  if(box){x0=box.x0;y0=box.y0;w=box.x1-box.x0;h=box.y1-box.y0}
  const s=Math.min(CW/w,CH/h)*(box?0.7:0.96);sl.vw={s,tx:(CW-w*s)/2-x0*s,ty:(CH-h*s)/2-y0*s}}

const COL={pt:'#f1d264',sel:'#5cc8f5',guide:'rgba(92,200,245,.85)',der:'#e4eaef',cal:'#ff9bd2'};
function drawOverlay(ctx,sl){

      p.lm.forEach(k=>{if(LM[k].type==='ln')d.seg(k,null,.5)});if(p.dr)p.dr(d);ctx.restore();}}

  for(const k of keys){const d=LM[k];if(!d)continue;const raw=sl.pts[k],isSel=selK.has(k);const a=getPts(sl,k);const derived=!raw&&a;
    if(!raw&&!derived)continue;if(derived&&!isSel)continue;

      const txt=p.n.replace(/（.*?）/g,'')+'  '+fmtV(r)+(r.u&&r.u!=='点'?unitTxt(r):r.u);tag(ctx,s.x+12,s.y+18,txt)}}}

}
function label(ctx,x,y,t,col){ctx.font='500 11px "IBM Plex Sans JP",system-ui,sans-serif';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)}

  ctx.fillStyle='rgba(5,7,10,.82)';ctx.strokeStyle=COL.sel;ctx.lineWidth=1;ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y-16,w,22,6):ctx.rect(x,y-16,w,22);ctx.fill();ctx.stroke();ctx.fillStyle='#e4eaef';ctx.fillText(t,x+6,y)}
function guideAPI(ctx,sl){

  const S2=q=>i2s(sl,q);

  const api={
    seg(a,b,ext=0){let A,B;if(b==null){const r=getPts(sl,a);if(!r||r.length<2)return;A=r[0];B=r[1]}else{A=P1(a);B=P1(b)}if(!A||!B)return;const v=sub(B,A);L(sub(A,mul(v,ext)),add(B,mul(v,ext)))},
    perp(p,a,b){const P=P1(p),A=P1(a),B=P1(b);if(!P||!A||!B)return;const F=foot(P,A,B);L(P,F)},
    perpL(p,k){const r=getPts(sl,k);if(!r)return;api.perp(p,r[0],r[1])},
    perp1(u,l){const U=getPts(sl,u),Lw=getPts(sl,l);if(!U||!Lw)return;const e=sub(Lw[0],Lw[1]);const n={x:-e.y,y:e.x};L(sub(Lw[1],mul(n,.6)),add(Lw[1],mul(n,.6)));api.perp(U[1],Lw[0],Lw[1])},
    vert(p){const P=P1(p);if(!P)return;const s=S2(P);ctx.beginPath();ctx.moveTo(s.x,0);ctx.lineTo(s.x,CH);ctx.stroke()},
    hor(k){const r=getPts(sl,k);let P;if(r&&r.length===2){const A=S2(r[0]),B=S2(r[1]);P=A.x<B.x?A:B;ctx.beginPath();ctx.moveTo(P.x-10,P.y);ctx.lineTo(P.x+Math.max(80,Math.abs(A.x-B.x)*1.4),P.y);ctx.stroke();return}
      P=P1(k);if(!P)return;const s=S2(P);ctx.beginPath();ctx.moveTo(s.x-70,s.y);ctx.lineTo(s.x+70,s.y);ctx.stroke()},

/* ---------- loupe ---------- */
function showLoupe(sp,ip){const sl=cur();lp.hidden=false;const left=sp.x>CW/2;lp.style.left=left?'12px':'';lp.style.right=left?'':'12px';
  lp.style.top=(document.getElementById('prompt').hidden?12:(document.getElementById('prompt').offsetHeight+18))+'px';
  const x=lp.getContext('2d'),W=lp.width,Z=Math.max(sl.vw.s*3,1.2)*DPR;x.setTransform(1,0,0,1,0,0);x.fillStyle='#000';x.fillRect(0,0,W,W);
  x.imageSmoothingEnabled=false;x.drawImage(sl.view,ip.x-W/2/Z,ip.y-W/2/Z,W/Z,W/Z,0,0,W,W);

/* ---------- pointer ---------- */
const ptrs=new Map();let act=null;
function evp(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function hitTest(sl,p){let best=null,bd=22;const sel=selParam(),selK=new Set(sel?sel.lm:[]);

  if(ptrs.size>2)return;

  if(st.mode==='measure'){act={t:'place'};preview=s2i(sl,p);showLoupe(p,preview);render();return}
  const h=hitTest(sl,p);
  if(h){pushHist(sl.id,[h.k]);act={t:'drag',k:h.k,i:h.i,off:sub(sl.pts[h.k][h.i],s2i(sl,p))};showLoupe(p,sl.pts[h.k][h.i]);return}

    const ip={x:(act.m0.x-v0.tx)/v0.s,y:(act.m0.y-v0.ty)/v0.s};sl.vw={s,tx:m.x-ip.x*s,ty:m.y-ip.y*s}}
  else if(act.t==='place'){preview=s2i(sl,p);showLoupe(p,preview)}
  else if(act.t==='drag'){const q=add(s2i(sl,p),act.off);sl.pts[act.k][act.i]=q;showLoupe(p,q)}
  else if(act.t==='pan'){sl.vw={s:act.v0.s,tx:act.v0.tx+p.x-act.p0.x,ty:act.v0.ty+p.y-act.p0.y}}

/* ---------- history ---------- */
function pushHist(slot,keys){const sl=S[slot];hist.push({slot,items:keys.map(k=>({k,prev:sl.pts[k]?sl.pts[k].map(q=>q&&{...q}):undefined}))});if(hist.length>200)hist.shift()}

  h.items.forEach(it=>{if(it.prev===undefined)delete sl.pts[it.k];else sl.pts[it.k]=it.prev});

/* ---------- measuring ---------- */
function buildQueue(sl,q){const seen=new Set(),out=[];for(const id of q.params){const p=id==='_cal'?{lm:['_cal']}:PID[id];
  for(const k of p.lm){if(seen.has(k))continue;seen.add(k);if(q.skip.has(k))continue;if(id!=='_cal'&&getPts(sl,k))continue;
    const r=sl.pts[k]||[];LM[k].subs.forEach((_,i)=>{if(!r[i])out.push({k,i})})}}return out}
function curItem(){const sl=S[st.q.slot];return buildQueue(sl,st.q)[0]||null}
function startMeasure(params,opt={}){const sl=cur();if(!sl.base){toast('先に画像を読み込んでください');return}

  const n=buildQueue(sl,st.q).length;if(!n){st.q=null;toast('必要な点はすべて入力済みです');return}
  st.q.total=n;st.mode='measure';setSheet('min');renderAll()}

  if(!curItem())finishMeasure();else renderAll()}

  if(d.type==='pair'&&it.i===1&&sl.pts[it.k]&&sl.pts[it.k][0]){pushHist(sl.id,[it.k]);sl.pts[it.k]=[sl.pts[it.k][0],{...sl.pts[it.k][0]}];save()}
  else st.q.skip.add(it.k);

const MAXD=3200;

  if(ts!=='1.2.840.10008.1.2'&&ts!=='1.2.840.10008.1.2.1')throw new Error('この DICOM 形式（'+ts+'）は未対応です。非圧縮で書き出すか JPEG / PNG をご利用ください');

  if(spp===3){for(let i=0;i<N;i++){d[i*4]=dv.getUint8(px.o+i*3);d[i*4+1]=dv.getUint8(px.o+i*3+1);d[i*4+2]=dv.getUint8(px.o+i*3+2);d[i*4+3]=255}}

    for(let i=0;i<N;i++){let v=bits===8?dv.getUint8(px.o+i):(prep?dv.getInt16(px.o+i*2,true):dv.getUint16(px.o+i*2,true));v=v*slope+icpt;vals[i]=v;if(v<mn)mn=v;if(v>mx)mx=v}

    perp1(u,l){const U=L.pts[u],Lw=L.pts[l];if(!U||!Lw)return;const e=sub(Lw[0],Lw[1]),n={x:-e.y,y:e.x};ln(sub(Lw[1],mul(n,.6)),add(Lw[1],mul(n,.6)),true);api.perp(U[1],Lw[0],Lw[1])},
    vert(p){const Pp=P1(p);if(!Pp)return;ln({x:Pp.x,y:vb[1]},{x:Pp.x,y:vb[1]+vb[3]},true)},
    hor(k){const r=L.pts[k];let Pp;if(r&&r.length===2)Pp=r[0].x<r[1].x?r[0]:r[1];else Pp=P1(k);if(!Pp)return;ln({x:Pp.x-W*.04,y:Pp.y},{x:Pp.x+W*.3,y:Pp.y},true)},
    hseg(a,b){const A=P1(a),B=P1(b);if(A&&B)ln(A,{x:B.x,y:A.y},true)},
    norm(k){const r=L.pts[k];if(!r)return;const m=mid(r[0],r[1]),e=sub(r[0],r[1]),n={x:-e.y,y:e.x};ln(sub(m,mul(n,1.4)),add(m,mul(n,1.4)),true)}};
  return{api,out}}
function learnSVG(p,r){const L=learnLoc(p);if(!L)return'';
  const items=p.lm.map(k=>({k,loc:{fig:L.fig,p:L.pts[k].map(q=>[q.x,q.y])},act:-1}));
  return gSVG(items,'full',{extra:(vb,W,sw)=>{const g=svgGuide(L,vb,W,sw);p.lm.forEach(k=>{if(LM[k].type==='ln'&&/(sup|inf|^AP_|FX_|UIV)/.test(k))g.api.seg(k,null,.5)});if(p.dr)try{p.dr(g.api)}catch(e){}
    let t='';if(r){const fs=W*.04;t=`<text x="${(vb[0]+W*.03).toFixed(1)}" y="${(vb[1]+fs*1.3).toFixed(1)}" font-size="${fs.toFixed(1)}" fill="#e4eaef" stroke="#05070a" stroke-width="${(fs*.25).toFixed(1)}" paint-order="stroke" font-family="system-ui,sans-serif" font-weight="600">例：${esc(fmtV(r))}${esc(r.u==='px'?' px':r.u)}</text>`}
    return g.out.join('')+t}})}
function learnHTML(p){const L=learnLoc(p);let ex=null;
  if(L){try{ex=compute(p,{pts:L.pts,mmpp:L.mmpp,facing:'R',has:true,apStd:true,age:68})}catch(e){}}

  return`<div class="lrn">${PMEAN[p.id]?`<h4>意味</h4><p class="mean">${esc(PMEAN[p.id])}</p>`:''}
   ${fig?`<h4>作図</h4><div class="gfig lfig">${fig}<div class="cap">シェーマ上の作図例。黄色が計測点、青の破線が作図線です。</div></div>`:''}

function shapesSVG(sh){return sh.map(o=>{const op=o.a!=null&&o.a<1?` opacity="${o.a}"`:'';

  if(o.t==='c')return`<circle cx="${o.c.x.toFixed(1)}" cy="${o.c.y.toFixed(1)}" r="${o.r.toFixed(1)}" fill="${o.f||'none'}" stroke="${o.s||'none'}" stroke-width="3"${op}/>`;

/* items: [{k,loc,act}] act = sub-index being placed (-1 = none, show all labelled) */
function gSVG(items,mode,opt){const fig=items[0].loc.fig;let base,full;
  if(FIG[fig]){base=FIG[fig].svg;full=FIG[fig].vb}else{const d=demoFor('pre',fig==='ap'?'ap':'lat');base=shapesSVG(d.shapes);full=[0,0,d.canvas.width,d.canvas.height]}
  const mmk=FIG[fig]?2.3:2.6,pts=items.flatMap(it=>it.loc.p);
  const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,bw=Math.max(...xs)-Math.min(...xs),bh=Math.max(...ys)-Math.min(...ys);
  let vb;
  if(mode==='thumb'){const sz=FIG[fig]?Math.max(150,Math.max(bw,bh)+70):Math.max(80*mmk,Math.max(bw,bh)+40*mmk);vb=[cx-sz/2,cy-sz/2,sz,sz]}
  else if(FIG[fig])vb=full;
  else{const h=Math.max(150*mmk,bh+70*mmk),w=Math.max(150*mmk,bw+70*mmk,h/1.25);vb=[cx-w/2,cy-h/2,w,h]}
  const W=Math.max(vb[2],vb[3]),r=W*(mode==='thumb'?.045:.02),fs=W*(items.length>1?.028:.034),sw=W*(mode==='thumb'?.012:.005);
  let ov='';
  items.forEach(it=>{const d=LM[it.k],P=it.loc.p,many=items.length>1;
    if(P.length===2)ov+=`<line x1="${P[0][0]}" y1="${P[0][1]}" x2="${P[1][0]}" y2="${P[1][1]}" stroke="#5cc8f5" stroke-width="${sw}" stroke-dasharray="${sw*3} ${sw*2}"/>`;
    P.forEach((q,i)=>{const on=it.act===i||(it.act<0&&!many)||(it.act==null);const col=on?'#5cc8f5':'#f1d264';
      ov+=`<circle cx="${q[0]}" cy="${q[1]}" r="${r*.45}" fill="${col}"/>`;
      if(on&&mode==='thumb'||it.act===i)ov+=`<circle cx="${q[0]}" cy="${q[1]}" r="${r}" fill="none" stroke="#5cc8f5" stroke-width="${sw}">${RM?'':`<animate attributeName="r" values="${r};${r*1.7};${r}" dur="1.6s" repeatCount="indefinite"/>`}</circle>`;
      if(mode!=='thumb'){const sub=P.length===2?(d.subs[i]||''):'';const t=many?(i===0?d.name:''):(sub||d.name);
        const lf=q[0]>vb[0]+vb[2]*.55;if(t)ov+=`<text x="${lf?q[0]-r*1.2:q[0]+r*1.2}" y="${q[1]-r*1.2}" text-anchor="${lf?'end':'start'}" font-size="${fs}" fill="${col}" stroke="#05070a" stroke-width="${fs*.28}" paint-order="stroke" font-family="system-ui,sans-serif" font-weight="600">${esc(t)}</text>`}})});
  if(opt&&opt.extra)ov=opt.extra(vb,W,sw)+ov;

function gTip(k){const d=LM[k];if(GTIP[k])return GTIP[k];

  if(/pi$|pw[SI]$/.test(k))return'椎体後壁の角（後上角または後下角）を取ります。骨棘は含めません。';
